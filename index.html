<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="password-generator">
      <h1>
        Generate a<br />
        <span>random password</span>
      </h1>
      <p class="tagline">Never use an insecure password again.</p>

      <button class="generate-button" type="button" onclick="generatePasswords()">Generate passwords</button>
      <div class="divider" aria-hidden="true"></div>

      <section class="passwords" aria-label="Generated passwords">
        <output class="password-field" id ="password-field1" aria-label="First generated password" onclick="copyPasswords1()"></output>
        <output class="password-field" id ="password-field2" aria-label="Second generated password" onclick="copyPasswords2()"></output>
        <div id="copied1" class="copied-message" aria-live="polite"></div>
        <div id="copied2" class="copied-message" aria-live="polite"></div>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
