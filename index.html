<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="password-generator">
      <h1>
        Generate a<br />
        <span>random password</span>
      </h1>
      <p class="tagline">Never use an insecure password again.</p>

      <button class="generate-button" type="button">Generate passwords</button>

      <div class="divider" aria-hidden="true"></div>

      <section class="passwords" aria-label="Generated passwords">
        <output class="password-field" aria-label="First generated password"></output>
        <output class="password-field" aria-label="Second generated password"></output>
      </section>
    </main>
  </body>
</html>
